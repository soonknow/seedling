
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>順農種苗場 - 營業時間表</title>
  <style>
	  .hours-table {
		border-collapse: collapse;
		font-family: system-ui, -apple-system, sans-serif;
		text-align: center;
		margin: 0 auto;
	  }
	  .hours-table th, .hours-table td {
		border: 1px solid #ccc;
		padding: 8px 12px;
		font-size: 16px;
	  }
	  .title-header p {
		font-size: 36px;
		margin: 8px 0 4px 0;
		font-weight: bold;
	  }
	  /* 放在營業時間底下的即時狀態樣式 */
	  .status-text {
		font-size: 18px;
		font-weight: bold;
		margin-bottom: 8px;
	  }
	  .status-open { color: #188038; }   /* 綠色 營業中 */
	  .status-closed { color: #d50000; } /* 紅色 休息中 */
	  .ic { color: #d50000; font-weight: bold; } /* 表格內的休樣式 */
</style>


</head>
<body>

  <div>
    <div id="table-container">營業時間載入中...</div>
  </div>

  <script>
    // 全域變數：紀錄載入時的日期字串與 periods 資料
	let initDateStr = "";
	let cachedPeriods = null;

	async function initHours() {
	  const containerEl = document.getElementById("table-container");

	  try {
		const { Place } = await google.maps.importLibrary("places");

		const place = new Place({
		  id: "ChIJf2XEu4G5bzQR5z4uliZsC7g",
		  requestedLanguage: "zh-TW"
		});

		await place.fetchFields({
		  fields: ["currentOpeningHours"]
		});

		const hoursData = place.currentOpeningHours || place.regularOpeningHours;

		if (hoursData && hoursData.periods) {
		  cachedPeriods = hoursData.periods;
		  
		  // 紀錄初始化時的本地日期 (格式: YYYY-MM-DD)
		  const now = new Date();
		  initDateStr = getLocalDateString(now);

		  // 1. 解析 periods 資料 (0:日 ~ 6:六)
		  const grid = {
			morn: Array(7).fill(false),
			aft:  Array(7).fill(false)
		  };

		  cachedPeriods.forEach(p => {
			if (p.open) {
			  const day = p.open.day;
			  const hour = p.open.hour;
			  if (hour < 12) {
				grid.morn[day] = true;
			  } else {
				grid.aft[day] = true;
			  }
			}
		  });

		  // 2. 組裝 HTML 表格
		  let tableHtml = `
			<table class="hours-table" style="width: 100%;">
			  <tr>
				<td colspan="8" class="title-header">
				  <p style="font-size: 36px;">營業時間</p>
				  <div id="status-badge" class="status-text"></div>
				</td>
			  </tr>
			  <tr>
				<td>時間</td>
				<td>日</td>
				<td>一</td>
				<td>二</td>
				<td>三</td>
				<td>四</td>
				<td>五</td>
				<td>六</td>
			  </tr>
			  <tr>
				<td>08:00<br>
				~<br>
				11:50</td>
		  `;

		  // 上午列 (0~6)
		  for (let d = 0; d <= 6; d++) {
			if (!grid.morn[d] && !grid.aft[d]) {
			  tableHtml += `<td rowspan="2" class="ic">休</td>`;
			} else {
			  tableHtml += `<td>${grid.morn[d] ? '○' : '休'}</td>`;
			}
		  }

		  tableHtml += `
			  </tr>
			  <tr>
				<td>14:00<br>~<br>17:00</td>
		  `;

		  // 下午列 (0~6)
		  for (let d = 0; d <= 6; d++) {
			if (grid.morn[d] || grid.aft[d]) {
			  tableHtml += `<td>${grid.aft[d] ? '○' : '休'}</td>`;
			}
		  }

		  tableHtml += `
			  </tr>
			</table>
		  `;

		  containerEl.innerHTML = tableHtml;

		  // 3. 立即更新第一次狀態
		  updateStatusBadge();

		  // 4. 重算 iframe 高度給父頁面
		  setTimeout(() => {
			if (window.frameElement) {
			  window.frameElement.style.height = (document.body.scrollHeight + 50) + 'px';
			}
		  }, 100);

		  // 5. 開啟背景定期檢查 (每 1 分鐘自動檢查一次)
		  setInterval(checkAndUpdateStatus, 60 * 1000);

		  // 6. 🔥 新增：當頁面 Get Focus 或切換分頁回來時，立即檢查與更新
		  window.addEventListener("focus", checkAndUpdateStatus);
		  document.addEventListener("visibilitychange", () => {
			if (document.visibilityState === "visible") {
			  checkAndUpdateStatus();
			}
		  });

		} else {
		  containerEl.innerText = "無法取得營業時間資料";
		}
	  } catch (err) {
		console.error("執行出錯：", err);
		containerEl.innerText = "營業時間載入失敗";
	  }
	}

	// 取得當前本地 YYYY-MM-DD 字串（避免 UTC 時區跨日誤差）
	function getLocalDateString(d) {
	  const year = d.getFullYear();
	  const month = String(d.getMonth() + 1).padStart(2, '0');
	  const day = String(d.getDate()).padStart(2, '0');
	  return `${year}-${month}-${day}`;
	}

	// 動態更新當前即時狀態文字（不消耗 API）
	function updateStatusBadge() {
	  const badgeEl = document.getElementById("status-badge");
	  if (!badgeEl || !cachedPeriods) return;

	  const now = new Date();
	  const currentDay = now.getDay(); // 0:日 ~ 6:六
	  const currentTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

	  const isOpen = cachedPeriods.some(p => {
		if (p.open && p.open.day === currentDay) {
		  const openTime = `${String(p.open.hour).padStart(2, '0')}:${String(p.open.minute).padStart(2, '0')}`;
		  let closeTime = "23:59";
		  if (p.close) {
			closeTime = `${String(p.close.hour).padStart(2, '0')}:${String(p.close.minute).padStart(2, '0')}`;
		  }
		  return currentTimeStr >= openTime && currentTimeStr <= closeTime;
		}
		return false;
	  });

	  badgeEl.className = `status-text ${isOpen ? 'status-open' : 'status-closed'}`;
	  badgeEl.innerText = isOpen ? "營業中" : "休息中";
	}

	// 檢查主邏輯：判斷是否跨日，決定要「重新整理頁面」還是「純更新狀態」
	function checkAndUpdateStatus() {
	  const now = new Date();
	  const currentDateStr = getLocalDateString(now);

	  // 判定是否跨日 (例如早上手機打開發現是昨天的頁面)
	  if (currentDateStr !== initDateStr) {
		console.log("跨日且重新回到頁面，進行整頁重新載入...");
		location.reload(); // 跨日直接重整
	  } else {
		// 當日：拿現有 periods 立即重新比對當下時間
		updateStatusBadge();
	  }
	}
	
  </script>

  <!-- 載入 SDK -->
  <script 
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAQ9tAGqE7_jjC5zz-vBNE-fpcCePW5W1w&libraries=places&v=weekly&language=zh-TW&loading=async&callback=initHours" 
    async 
    defer>	
	
  </script>
