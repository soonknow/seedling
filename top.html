
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>順農種苗場 - 營業時間表</title>
  <style>
    /* 營業時間表格樣式 */
    .hours-table {
      border-collapse: collapse;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      margin-top: 10px;
    }
    .hours-table th, .hours-table td {
      border: 1px solid #ccc;
      padding: 8px 12px;
      font-size: 16px;
    }
    .hours-table th {
      background-color: #f5f5f5;
    }
    .title-row p {
      font-size: 36px;
      margin: 10px 0;
      font-weight: bold;
    }
    .status-open { color: #188038; font-weight: bold; font-size: 18px; margin-bottom: 8px; }
    .status-closed { color: #d50000; font-weight: bold; font-size: 18px; margin-bottom: 8px; }
    .ic { color: #d50000; font-weight: bold; } /* 公休樣式 */
  </style>
</head>
<body>

  <div>
    <div id="status-text">營業狀態載入中...</div>
    <div id="table-container"></div>
  </div>

  <script>
    async function initHours() {
      const statusEl = document.getElementById("status-text");
      const containerEl = document.getElementById("table-container");

      try {
        const { Place } = await google.maps.importLibrary("places");

        const place = new Place({
          id: "ChIJf2XEu4G5bzQR5z4uliZsC7g",
          requestedLanguage: "zh-TW"
        });

        await place.fetchFields({
          fields: ["regularOpeningHours"]
        });

        if (place.regularOpeningHours && place.regularOpeningHours.periods) {
          const periods = place.regularOpeningHours.periods;

          // 1. 純 JS 判斷當前即時營業狀態 (支援 v=weekly)
          const now = new Date();
          const currentDay = now.getDay(); // 0:日, 1:一 ... 6:六
          const currentTimeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

          const isOpen = periods.some(p => {
            if (p.open && p.open.day === currentDay) {
              const openTime = `${String(p.open.hour).padStart(2, '0')}:${String(p.open.minute).padStart(2, '0')}`;
              let closeTime = "23:59";
              if (p.close) {
                closeTime = `${String(p.close.hour).padStart(2, '0')}:${String(p.close.minute).padStart(2, '0')}`;
              }
              return currentTimeStr >= openTime && currentTimeStr <= closeTime;
            }
            return false;
          });

          statusEl.className = isOpen ? "status-open" : "status-closed";
          statusEl.innerText = isOpen ? "● 營業中" : "● 休息中";

          // 2. 解析 periods 資料生成表格矩陣 (日=0, 一=1 ... 六=6)
          // 順農苗場標準兩時段：[08:00~11:50, 14:00~17:00]
          const grid = {
            morn: Array(7).fill(false), // 上午時段
            aft:  Array(7).fill(false)  // 下午時段
          };

          periods.forEach(p => {
            const day = p.open.day;
            const hour = p.open.hour;
            if (hour < 12) {
              grid.morn[day] = true;
            } else {
              grid.aft[day] = true;
            }
          });

          // 3. 渲染 HTML 表格
          let tableHtml = `<center>
            <table class="hours-table">
              <tr>
                <td colspan="8"><p style="font-size: 36px;">營業時間</p></td>
              </tr>
              <tr>
                <td>時間</td>
                <td>日</td>
                <td>一</td>
                <td>二</td>
                <td>三</td>
                <td>四</td>
                <td>五</td>
                <td>六</td>
              </tr>
              <tr>
                <td>08:00~11:50</td>
          `;

          // 填寫上午列 (日:0 到 六:6)
          for (let d = 0; d <= 6; d++) {
             // 若全天公休，使用 rowspan=2 合併儲存格
			  if (!grid.morn[d] && !grid.aft[d]) {
				tableHtml += `<td rowspan="2" class="ic">休</td>`;
			  } else {
				tableHtml += `<td>${grid.morn[d] ? '○' : '休'}</td>`;
			  }
          }

          tableHtml += `
              </tr>
              <tr>
                <td>14:00~17:00</td>
          `;

          // 填寫下午列 (日:0 到 六:6)
          for (let d = 0; d <= 6; d++) {
			   if (grid.morn[d] || grid.aft[d]) {
				tableHtml += `<td>${grid.aft[d] ? '○' : '休'}</td>`;
			  }
          }
         

          tableHtml += `
              </tr>
            </table>
			</center>
          `;

          containerEl.innerHTML = tableHtml;

        } else {
          statusEl.innerText = "無法取得營業時間資料";
        }
      } catch (err) {
        console.error("執行出錯：", err);
        statusEl.innerText = "營業時間載入失敗";
      }
    }
	
	
	setTimeout(() => {
	  if (window.frameElement) {
		window.frameElement.style.height = (document.body.scrollHeight + 100) + 'px';
	  }
	}, 100);
	
  </script>

  <!-- 載入 SDK -->
  <script 
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAQ9tAGqE7_jjC5zz-vBNE-fpcCePW5W1w&libraries=places&v=weekly&language=zh-TW&loading=async&callback=initHours" 
    async 
    defer>	
	
  </script>
